    <style>
        * {
            padding: 0;
            margin: 0;
        }

        body {
            background-color: #000000;
            color: #fff;
            font-size: 12px;
            font-family: Arial, Helvetica, sans-serif;
        }

        canvas {
            cursor: crosshair;
            position: absolute;
        }

        a {
            color: #fff;
            text-decoration: none;
            cursor: pointer;
        }

        #menu {
            position: absolute;
            top: 50%;
            margin-top: -45px;
            text-align: center;
            width: 100%;
        }

        #title {
            font-size: 24px;
            margin-bottom: 15px;
        }

        #message {
            font-size: 14px;
            margin-bottom: 30px;
        }

        a#tweet {
            color: red;
            font-size: 11px;
            display: inline-block;
            margin-top: 15px;
            padding: 5px 10px;
            background-color: transparent;
            border: 1px solid red;
        }

        a#tweet:hover {
            color: black;
            background-color: white;
        }

        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            list-style: none;
        }

        #menu,
        #hud {
            user-select: none;
            -moz-user-select: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
        }

        #hud li.score {
            width: 120px;
            overflow: hidden;
        }

        #hud li {
            float: left;
            margin-right: 20px;
            white-space: nowrap;
        }

        .menu-btn {
            font-size: 20px;
            font-weight: bold;
            display: inline-block;
            margin: 5px;
            padding: 8px 15px;
            background: #444;
            border-radius: 3px;
        }

        .menu-btn:hover {
            background: #666;
        }

        .progress {
            height: 15px;
            width: 200px;
            background-color: #333;
            border-radius: 7px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: #333333;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: white;
        }

        @media (max-width: 768px) {
            #hud {
                flex-direction: column;
                gap: 5px;
            }

            .progress {
                width: 150px;
            }
        }
    </style>

</head>

        //------------------------------------

        //------------------------------------
        // EVENT HANDLERS
        //------------------------------------

        function resize(e) {
            canvas.width = canvasWidth = fieldRange.right = window.innerWidth;
            canvas.height = canvasHeight = fieldRange.bottom = window.innerHeight;

            context = canvas.getContext('2d');
            context.fillStyle = 'white';
            context.strokeStyle = 'white';
            context.lineWidth = 1;
        }

        function start(e) {
            play();
            dom.menu.style.display = 'none';
            e.preventDefault();
        }

        function mouseMove(e) { mouse.set(e.clientX, e.clientY); }
        function touchMove(e) { mouse.set(e.touches[0].clientX, e.touches[0].clientY); console.log(e.touches[0].clientX, e.touches[0].clientY) }
        function mouseDown(e) { isMouseDown = true; }
        function mouseUp(e) { isMouseDown = false; }
        function click(e) { if (ship) ship.fire(beams) }


        //------------------------------------
        // FRAME LOOP
        //------------------------------------

        function loop() {
            if (isPaused) return; // 暂停

            context.clearRect(0, 0, canvasWidth, canvasHeight);

            // 重置绘图状态
            context.strokeStyle = 'rgb(255, 255, 255)';
            context.lineWidth = 1;
            context.fillStyle = 'rgb(255, 255, 255)';

            var now = new Date().getTime();

            // Spawn Debri
            if (now - debriLastSpawn > 300) {
                debris.push(new Debri(canvasWidth));
                debriLastSpawn = now;
            }

            // Debri update
            debris.eachUpdate();

            if (isPlay) {
                // Spawn

                if (now - asteroidLastSpawn > ASTEROID_SPAWN_TIME && asteroids.length < ASTEROID_MAX_NUM) {
                    asteroids.push(Asteroid.spawn());
                    asteroidLastSpawn = now;
                }

                // UFO
                if (!ufo && Math.random() < UFO_INCIDENCE) {
                    ufo = Ufo.spawn();
                }

                // 太空列车
                if (!train && Math.random() < TRAIN_INCIDENCE) {
                    train = Train.spawn();
                }

                // 太空章鱼
                if (!octopus && Math.random() < OCTOPUS_INCIDENCE) {
                    octopus = SpaceOctopus.spawn();
                }

                // Update

                if (ship) {
                    if (isMouseDown) ship.fire(beams);
                    ship.update(mouse);
                }

                if (ufo) {
                    ufo.update();
                    if (ufo.vanished) {
                        item = new Item(ufo.x, ufo.y);
                        ufo = null;
                    } else if (hitDetection(ufo, ship)) {
                        gameOver();
                    }
                }

                if (train) {
                    train.update();
                    if (train.vanished) {
                        train = null;
                    } else if (hitDetection(train, ship)) {
                        gameOver();
                    }
                }

                if (octopus) {
                    octopus.update();
                    if (!octopus.vanished && hitDetection(octopus, ship)) {
                        gameOver();
                    }
                }

                if (octopus && !octopus.vanished && hitDetection(octopus, ship)) {
                    gameOver();
                }

                if (item) {
                    item.update();
                    if (item.vanished) {
                        item = null;
                    } else if (hitDetection(item, ship)) {
                        ship.setSpecialWepon(item.wepon);
                        item = null;
                    }
                }

                beams.eachUpdate(function (index, beam) {
                    for (var i = 0; i < asteroids.length; i++) {
                        asteroid = asteroids[i];
                        if (hitDetection(beam, asteroid)) {
                            score += asteroid.damage(beam.power, splinters);
                            beam.notifyHit();
                        }
                    }

                    if (ufo && hitDetection(beam, ufo)) {
                        score += ufo.damage(beam.power, splinters);
                        beam.notifyHit();
                    }

                    if (octopus && hitDetection(beam, octopus)) {
                        score += octopus.damage(beam.power, splinters);
                        beam.notifyHit();
                    }

                    for (var i = 0; i < wingmans.length; i++) {
                        var wingman = wingmans[i];
                        if (hitDetection(beam, wingman)) {
                            wingman.damage(beam.power, splinters);
                            beam.notifyHit();
                        }
                    }

                    // 列车碰撞检测
                    if (train && hitDetection(beam, train)) {
                        score += train.damage(beam.power, splinters);
                        beam.notifyHit();
                    }
                });

                asteroids.eachUpdate(function (index, asteroid) {
                    if (hitDetection(asteroid, ship)) {
                        // 如果有护盾，弹开陨石而不是游戏结束
                        if (ship.hasShield) {
                            // 计算弹开方向
                            var angle = Math.atan2(asteroid.y - ship.y, asteroid.x - ship.x);
                            asteroid.angle = angle;
                            asteroid.v = Point.polar(asteroid.v.length() * 1.5, angle); // 增加50%速度

                            // 添加弹开特效
                            splinters.push(new Splinter(asteroid.x, asteroid.y, 10, 5));
                        } else {
                            gameOver();
                        }
                    }
                });

                wingmans.eachUpdate(function (index, wingman) {
                    if (hitDetection(wingman, ship)) {
                        gameOver();
                    }
                });

                if (friendlyTurrets) {
                    friendlyTurrets.eachUpdate();
                }

                splinters.eachUpdate();

                // Display

                dom.wepon.innerHTML = ship.currentWepon.name;
                dom.score.innerHTML = Math.ceil(score);
            }

            // Draw


            // 1. 先绘制背景元素
            context.beginPath();
            if (splinters) splinters.eachDraw(context);
            if (debris) debris.eachDraw(context);
            context.fill();

            // 2. 绘制飞机
            context.beginPath();
            if (ship) ship.draw(context);
            context.stroke();

            // 3. 绘制UFO
            if (ufo) {
                context.beginPath();
                ufo.draw(context);
                context.stroke();
            }

            // 4. 绘制太空列车
            if (train) {
                context.beginPath();
                train.draw(context);
                context.stroke();
            }

            // 5. 绘制太空章鱼
            if (octopus) {
                context.beginPath();
                octopus.draw(context);
                context.stroke();
            }

            // 6. 绘制章鱼僚机
            if (wingmans) {
                context.beginPath();
                wingmans.eachDraw(context);
                context.stroke();
            }

            // 7.绘制炮台
            if (friendlyTurrets) {
                context.beginPath();
                friendlyTurrets.eachDraw(context);
                context.stroke();
            }

            // 8. 绘制小行星
            if (asteroids) {
                context.beginPath();
                asteroids.eachDraw(context);
                context.stroke();
            }

            // 9. 绘制子弹
            if (beams) beams.eachDraw(context);

            // 10. 绘制物品
            if (item) {
                context.beginPath();
                context.strokeStyle = item.wepon.color;
                item.draw(context);
                context.stroke();
            }

            // 11. 绘制游戏结束效果
            if (ship && ship.died) {
                ship.update();
                context.beginPath();
                ship.splinter.draw(context);
                context.fill();
            }
        }


        //------------------------------------
        // FUNCTIONS
        //------------------------------------

        // 开始
        function play() {
            hideAllButtons();
            dom.startBtn.style.display = 'inline-block';
            isPaused = false;
            dom.menu.style.display = 'none';

            ship = new Ship(canvasWidth / 2, canvasHeight / 2, 8);
            mouse.set(ship.x, ship.y);
            beams = new Collection();
            asteroids = new Collection();
            wingmans = new Collection();
            splinters = new Collection();
            friendlyTurrets = new Collection();
            ufo = null;
            octopus = null;
            item = null;
            train = null;
            score = 0;
            last_score = 0;
            sessionHighScore = 0;
            isMouseDown = false;
            isPlay = true;
            document.getElementById("special-time").textContent = "-"; // 重置时间显示
            document.getElementById("special-time").style.color = "white";
        }

        function togglePause() {
            if (!isPlay) return; // 如果游戏没开始，不处理

            isPaused = !isPaused;

            if (isPaused) {
                dom.title.innerHTML = '游戏暂停';
                dom.message.innerHTML = '';
                hideAllButtons();
                dom.continueBtn.style.display = 'inline-block';
                dom.menu.style.display = 'block';
            } else {
                dom.menu.style.display = 'none';
            }
        }

        // 游戏结束

        // パスの衝突判定を行う
        // 引数に指定するオブジェクトは path プロパティから Path オブジェクトが参照可能であること
        // Perform path collision detection
        // The object specified in the argument can be referenced from the path property.
        function hitDetection(a, b) {
            var ap = a.path, bp = b.path;
            var as, bs; // Segments
            var a1, a2, b1, b2; // Points

            for (i = 0, ilen = ap.segmentNum(); i < ilen; i++) {
                as = ap.segment(i);
                a1 = as[0];
                a2 = as[1];
                for (j = 0, jlen = bp.segmentNum(); j < jlen; j++) {
                    bs = bp.segment(j);
                    b1 = bs[0];
                    b2 = bs[1];
                    if (intersection(a1, a2, b1, b2)) return true;
                }
            }

            return false;
        }

        // hitDetection　で使用される直線の交差判定
        // 交差しているなら true
        // Straight line intersection detection used in hitDetection
        // True if they intersect
        function intersection(a1, a2, b1, b2) {
            var ax = a2.x - a1.x, ay = a2.y - a1.y;
            var bx = b2.x - b1.x, by = b2.y - b1.y;
            return (ax * (b1.y - a1.y) - ay * (b1.x - a1.x)) *
                (ax * (b2.y - a1.y) - ay * (b2.x - a1.x)) <= 0 &&
                (bx * (a1.y - b1.y) - by * (a1.x - b1.x)) *
                (bx * (a2.y - b1.y) - by * (a2.x - b1.x)) <= 0;
        }

        Point.prototype = {

            length: function () {

                if (isUndefined(thickness)) thickness = 1;

                var len = Math.sqrt(this.x * this.x + this.y * this.y);
                var nx = 0, ny = 0;

                if (len) {
                    nx = this.x / len;
                    ny = this.y / len;
                }

                this.x = nx * thickness;
                this.y = ny * thickness;

            // In order to solve the problem that the hit judgment can not be taken when the line is short or the movement is fast
            // The path for hit detection takes the last position and the current start position, and render path is renderPath
            this.path = new BeamPath([this, this.clone()], false);

                        if (d < this.chain.range && d > 5 && d < minDist) {
                            minDist = d;
                            nearest = t;
                        }
                    }
                    if (nearest) {
                        this.set(nearest.x, nearest.y);
                        nearest.damage(this.power, splinters);
                        this.power *= this.chain.decay;
                        this.chain.maxJumps--;
                        return; // 继续存在，不消失
                    } else {
                        this.vanished = true;
                    }
                }

                else if (this.homing || !this.through) {
                    this.vanished = true;
                }

            update: function () {
                if (this.vanished) return;

                if (this.exploding) {
                    this.path.update(); // Explosion update
                    if (this.path.complete) this.vanished = true;
                    return;
                }

                // 追踪逻辑
                if (this.homing && this.homing.enabled) {
                    // 获取所有有效目标
                    var targets = [];

                    // 添加小行星
                    for (var i = 0; i < asteroids.length; i++) {
                        if (!asteroids[i].vanished) {
                            targets.push(asteroids[i]);
                        }
                    }

                    // 添加UFO、章鱼、列车
                    if (ufo && !ufo.vanished) targets.push(ufo);
                    if (octopus && !octopus.vanished) targets.push(octopus);
                    if (train && !train.vanished) targets.push(train);

                    // 添加僚机
                    for (var i = 0; i < wingmans.length; i++) {
                        if (!wingmans[i].vanished) {
                            targets.push(wingmans[i]);
                        }
                    }

                    // 寻找最近的敌人
                    var nearest = null;
                    var minDist = Infinity;
                    for (var i = 0; i < targets.length; i++) {
                        var t = targets[i];
                        // 使用中心点距离计算
                        var d = Math.sqrt(Math.pow(this.x - t.x, 2) + Math.pow(this.y - t.y, 2));
                        if (d < this.homing.range && d < minDist) {
                            minDist = d;
                            nearest = t;
                        }
                    }

                    // 如果有目标，调整角度
                    if (nearest) {
                        // 计算目标方向
                        var dx = nearest.x - this.x;
                        var dy = nearest.y - this.y;
                        var targetAngle = Math.atan2(dy, dx);

                        // 计算角度差并规范化到[-PI, PI]范围
                        var angleDiff = targetAngle - this.angle;
                        while (angleDiff > PI) angleDiff -= TWO_PI;
                        while (angleDiff < -PI) angleDiff += TWO_PI;

                        // 应用转向，使用更平滑的转向
                        var turnAmount = this.homing.turnRate;
                        if (Math.abs(angleDiff) < turnAmount) {
                            this.angle = targetAngle; // 直接对准
                        } else {
                            // 平滑转向
                            this.angle += (angleDiff > 0 ? 1 : -1) * turnAmount;
                        }

                        // 更新速度方向但不改变速度大小
                        var currentSpeed = this.speed;
                        //this.speed = currentSpeed * 0.98; // 轻微减速增加追踪效果
                    }
                }

                // 移动子弹
                var v = Point.polar(this.speed, this.angle);
                var renderTail = this.renderPath[1];

                // 画面外检测
                if (!fieldRange.contains(renderTail.x, renderTail.y)) {
                    this.vanished = true;
                    return;
                }

                // 前回の後尾位置をとる
                this.path[1].set(renderTail);
                // 先頭位置を移動
                this.add(v);

                // 射出の判定を行って描画用パスを更新する, 射出が完了するまでは後尾の座標は移動しない
                if (this.releaseCompleted) {
                    // 射出が完了しているなら後尾を移動
                    renderTail.add(v);
                } else {
                    // Update the drawing path by determining the injection, and the tail coordinate does not move until the injection is completed
                    this.releaseCompleted = this.distanceTo(renderTail) > this.length;
                    if (this.releaseCompleted) {
                        renderTail.set(Point.polar(this.length, this.angle - PI).add(this));
                    }
                }
            },

            draw: function (ctx) {
                ctx.beginPath();
                ctx.strokeStyle = this.color;
                ctx.lineWidth = this.width;
                this.renderPath.draw(ctx);
                ctx.stroke();
            }
        });

                }

                for (var i = 0, p; i < 10; i++) {

                    if (!this[i]) {

                        this[i] = p;
                    }
                }
            }
        });

        // ランダムなパラメータを与えられた新しい Asteroid オブジェクトを返す

        // Returns a new Asteroid object with random parameters
        // Appearance location has a traveling angle to enter the screen outside the screen
        Asteroid.spawn = function () {
            var side = randInt(3); // 出現位置をランダムに決定
            var angle = randUniform(PI * 0.5);
            var x, y;

            // 0: Left, 1: Right
            if (side === 0 || side === 1) {
                y = randUniform(canvasHeight + ASTEROID_MAX_SIZE, -ASTEROID_MAX_SIZE);
                x = (side === 0) ? - ASTEROID_MAX_SIZE : canvasWidth + ASTEROID_MAX_SIZE;
                angle = (side === 0) ? angle - PI * 0.25 : angle + PI * 0.75;
            }
            // 2: Top, 3: Bottom
            else {
                x = randUniform(canvasWidth + ASTEROID_MAX_SIZE, -ASTEROID_MAX_SIZE);
                y = (side === 2) ? - ASTEROID_MAX_SIZE : canvasHeight + ASTEROID_MAX_SIZE;
                angle = (side === 2) ? angle + PI * 0.25 : angle - PI * 0.75;
            }

            // Asteroid.MIN_SIZE ~ ASTEROID_MAX_SIZE の間でランダム
            var radius = randUniform(ASTEROID_MAX_SIZE, ASTEROID_MIN_SIZE);
            var asteroid = new Asteroid(x, y, radius, angle);
            asteroid.isSplitter = Math.random() < 0.2; // 20% 几率为分裂陨石
            asteroid.hasSplit = false; // 初始被攻击分裂状态
            return asteroid;
        };

        Asteroid.prototype = extend(new Point(), {
            vanished: false,
            make: function () {
                this.v = Point.polar(1, this.angle);
                this.v.normalize((1 - this.radius / ASTEROID_MAX_SIZE) * 1.75 + 0.25);

                this.path = new Path();
                for (var i = 0, num = 12, radius; i < num; i++) {
                    radius = randUniform(this.radius, this.radius * 0.5);
                    this.path.push(Point.polar(radius, TWO_PI * i / num).add(this));
                }
            },

            // 与えられた damage 分半径を小さくする, ASTEROID_MIN_SIZE を下回った場合消失
            // damage は 1 までの割合で指定, ASTEROID_MAX_SIZE の係数としてダメージの割合を表現する
            // 引数で渡された Collection に小惑星の大きさを反映した Splinter を追加する
            // Decrease radius by given damage, disappear if it falls below ASTEROID_MIN_SIZE
            // damage is specified as a ratio up to 1, and the damage ratio is expressed as a coefficient of ASTEROID_MAX_SIZE
            // Add a Splinter that reflects the size of the asteroid to the Collection passed as an argument
            damage: function (damage, splinters) {
                if (damage <= 0) return;

                var radiusTemp = this.radius;
                var debrisNum = Math.round(32 * damage);
                var score_asteroid = SCORE.ASTEROID_DAMAGE;

                this.radius -= ASTEROID_MAX_SIZE * damage;

                if (this.radius < ASTEROID_MIN_SIZE) {
                    this.vanished = true;
                    score_asteroid = SCORE.ASTEROID_DESTROY;
                } else {
                    // 进方向调整和刷新外形
                    this.angle += DEG_TO_RAD * randUniform(30, -30);
                    this.make();
                }

                // 检查是否是分裂陨石且是第一次被击中
                if (this.isSplitter && !this.hasSplit) {
                    this.hasSplit = true; // 标记为已分裂
                    var splitCount = randInt(4, 2); // 分裂为2~4个新陨石

                    // 计算总大小百分比（保持总量在80%-120%之间）
                    var totalPercentage = randUniform(1.2, 0.8);

                    for (var s = 0; s < splitCount; s++) {
                        // 分配百分比（最后一个用剩余部分）
                        var percentage = s === splitCount - 1 ?
                            totalPercentage :
                            randUniform(totalPercentage * 0.7, totalPercentage * 0.3);
                        totalPercentage -= percentage;

                        var childRadius = radiusTemp * percentage;
                        // 确保新陨石不小于最小尺寸
                        childRadius = Math.max(childRadius, ASTEROID_MIN_SIZE);

                        var childAngle = randUniform(TWO_PI);
                        var child = new Asteroid(this.x, this.y, childRadius, childAngle);

                        // 新陨石有50%几率也是分裂陨石
                        child.isSplitter = Math.random() < 0.3;

                        // 给新陨石一个初始速度（基于原速度和随机方向）
                        var speedFactor = randUniform(1.5, 0.5);
                        child.v = Point.polar(this.v.length() * speedFactor, childAngle);

                        asteroids.push(child);
                    }
                }

                splinters.push(new Splinter(this.x, this.y, radiusTemp, debrisNum));

                return score_asteroid;
            },

            update: function () {
                if (this.vanished) return;

                // 画面外に出たら消失
                if (!fieldRange.contains(this.x, this.y, ASTEROID_MAX_SIZE + 10)) {
                    this.vanished = true;
                    return;
                }

                var v = this.v;
                this.add(v);
                this.path.eachPoints(function (p, i) { p.add(v); });
            },

            draw: function (ctx) {
                ctx.strokeStyle = this.color;
                this.path.draw(ctx);
            }
        });

                ctx.save();

                // 绘制主体
                ctx.beginPath();
                ctx.strokeStyle = 'rgb(255, 255, 255)';
                ctx.lineWidth = 1;
                this.path.draw(ctx);
                ctx.stroke();

                // 绘制眼睛
                ctx.fillStyle = 'white';
                this.eyes.forEach(eye => {
                    ctx.beginPath();
                    ctx.arc(this.x + eye.x, this.y + eye.y, eye.size, 0, TWO_PI);
                    ctx.fill();

                    // 愤怒状态下眼睛变红
                    if (this.isAngry) {
                        ctx.fillStyle = 'red';
                        ctx.beginPath();
                        ctx.arc(this.x + eye.x, this.y + eye.y, eye.size / 2, 0, TWO_PI);
                        ctx.fill();
                        ctx.fillStyle = 'white';
                    }
                });

                // 绘制触手
                ctx.strokeStyle = 'rgb(255, 255, 255)';
                this.tentacles.forEach(t => t.draw(ctx));

                // 恢复绘图状态
                ctx.restore();
            }
        });

        SpaceOctopus.prototype.update = function () {
            // 已消失的章鱼不再更新
            if (this.vanished) return;

            // 更新目的地逻辑 - 更随机且更少改变目的地
            var v = this.v;
            var destination = this.destination;

            // 降低改变目的地的频率，增加随机性
            if (Math.random() < 0.005 || this.distanceTo(destination) < 100) {
                // 随机选择屏幕内的一个位置，但避免太靠近边缘
                destination.set(
                    randUniform(canvasWidth * 0.9, canvasWidth * 0.1),
                    randUniform(canvasHeight * 0.9, canvasHeight * 0.1)
                );
            }

            v.set(destination).sub(this);

            // 基础速度并增加随机速度变化
            var baseSpeed = this.speed * (0.5 + Math.random() * 0.3); // 基础速度在50%-80%之间波动
            var speed = this.isAngry ? baseSpeed * 1.2 : baseSpeed; // 愤怒状态速度加成减少

            var dist = v.length();
            if (dist > speed) {
                v.normalize(speed);
            }

            // 减小波浪效果幅度，使其不影响主要移动方向
            var waveX = Math.sin(Date.now() / 800) * 10;
            var waveY = Math.cos(Date.now() / 700) * 15;

            // 应用移动和波浪效果
            this.x += v.x + waveX * 0.2;
            this.y += v.y + waveY * 0.5;

            // 更新主体位置
            this.path.eachPoints(function (p, i) {
                p.x = this.x + Math.cos(TWO_PI * i / 12) * 15;
                p.y = this.y + Math.sin(TWO_PI * i / 12) * 15;
            }.bind(this));

            // 攻击逻辑
            this.attackTimer += 1000 / FPS;
            if (this.attackTimer >= this.attackInterval) {
                this.fire();
                this.attackTimer = 0;
            }

            // 更新触手
            this.tentacles.forEach(t => t.update());
        };

        // 触手类
        function Tentacle(parent, index) {
            this.parent = parent;
            this.index = index;
            this.segments = []; // 触手分段
            this.length = 25;  // 初始长度
            this.extended = false;
            this.angle = TWO_PI * this.index / 8;

            // 初始化3个触手关节
            for (var i = 0; i < 3; i++) {
                this.segments.push({
                    x: 0, y: 0,
                    length: this.length / 3,
                    angle: this.angle
                });
            }
        }

        Tentacle.prototype = {
            extend: function () {
                this.length = 40;  // 伸长触手
                this.extended = true;
                // 更新分段长度
                for (var i = 0; i < this.segments.length; i++) {
                    this.segments[i].length = this.length / 3;
                }
            },

            update: function () {
                // 更自然的触手摆动效果
                var waveSpeed = this.extended ? 600 : 800;
                var waveSize = this.extended ? 8 : 4;

                // 基础角度
                this.angle = TWO_PI * this.index / 8 + Math.sin(Date.now() / 1000) * 0.2;

                // 更新每个触手分段
                var prevX = this.parent.x;
                var prevY = this.parent.y;

                for (var i = 0; i < this.segments.length; i++) {
                    var segment = this.segments[i];

                    // 添加波浪效果 - 每个分段有不同的相位
                    var segmentWave = Math.sin(Date.now() / waveSpeed + this.index * 0.5 + i * 0.3) * waveSize;

                    // 更新分段角度
                    segment.angle = this.angle + segmentWave * 0.1;

                    // 计算分段末端位置
                    segment.x = prevX + Math.cos(segment.angle) * segment.length;
                    segment.y = prevY + Math.sin(segment.angle) * segment.length;

                    prevX = segment.x;
                    prevY = segment.y;
                }
            },

            draw: function (ctx) {
                // 绘制触手 - 现在有分段效果
                var prevX = this.parent.x;
                var prevY = this.parent.y;

                // 触手根部稍微粗一些
                ctx.lineWidth = 2;

                for (var i = 0; i < this.segments.length; i++) {
                    var segment = this.segments[i];

                    ctx.beginPath();
                    ctx.moveTo(prevX, prevY);
                    ctx.lineTo(segment.x, segment.y);
                    ctx.stroke();

                    // 逐渐变细
                    ctx.lineWidth = Math.max(1, 2 - i * 0.5);

                    prevX = segment.x;
                    prevY = segment.y;
                }

                // 恢复默认线宽
                ctx.lineWidth = 1;
            }
        };

        //生成
        SpaceOctopus.spawn = function () {
            // 如果章鱼已经存在且未消失，不生成新章鱼
            if (octopus && !octopus.vanished) return null;

            var x, y, side = randInt(3);
            if (side === 0 || side === 1) {
                y = randUniform(canvasHeight + 50, -50);
                x = (side === 0) ? -50 : canvasWidth + 50;
            } else {
                x = randUniform(canvasWidth + 50, -50);
                y = (side === 2) ? -50 : canvasHeight + 50;
            }

            // 重置血条显示
            document.getElementById("octopus").style.width = "100%";
            document.getElementById("octopus").style["background-color"] = "#8a2be2";
            document.getElementById("octopus-hp").innerHTML = "4000";

            return new SpaceOctopus(x, y);
        };


        /**
         * Wingman
         * 
         * @super Point
         */
        function Wingman(x, y) {
            Point.call(this, x, y);
            extend(this, WINGMAN_CONFIG);


            // 生成随机颜色（确保与白色边框区分）
            this.color = getRandomColor();
            this.attackPattern = ['single', 'triple', 'spread'][randInt(2)]; // 随机选择攻击模式

            // 生成特效相关
            this.spawnTime = new Date().getTime();
            this.spawnRadius = 0;
            this.maxSpawnRadius = this.size * 3;

            // 创建路径
            this.path = new Path();
            for (var i = 0; i < 8; i++) {
                var angle = TWO_PI * i / 8;
                this.path.push(new Point(
                    this.x + this.size * Math.cos(angle),
                    this.y + this.size * Math.sin(angle)
                ));
            }

            this.destination = new Point(randUniform(canvasWidth), randUniform(canvasHeight));
            this.v = new Point();
            this.attackTimer = 0;

            // 初始无敌时间
            this.invincible = true;
            setTimeout(() => { this.invincible = false; }, 1000);

            // 每个僚机生成时随机赋予一个固定速度（0.3x ~ 1.7x 基础速度）
            this.speed = WINGMAN_CONFIG.speed * (0.3 + Math.random() * 1.4);
        }

        // 生成随机颜色函数
        function getRandomColor() {
            // 使用HSL确保颜色不过于灰暗或刺眼
            var hue = randUniform(360);
            var saturation = randUniform(70, 30); // 30-70%饱和度
            var lightness = randUniform(70, 40);  // 40-70%亮度
            return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
        }

        Wingman.prototype = extend(new Point(), {
            vanished: false,

            damage: function (damage, splinters) {
                if (this.invincible) return 0; // 无敌状态下不受伤害

                this.hp -= damage * 100;

                if (this.hp <= 0) {
                    this.vanished = true;
                    splinters.push(new Splinter(this.x, this.y, 15, 10));

                    // 生成友方炮台
                    friendlyTurrets.push(new FriendlyTurret(this.x, this.y));

                    return this.score;
                }
                return 0;
            },
        });

        Wingman.prototype.fire = function () {
            var angleToShip = ship ? this.angleTo(ship) : randUniform(TWO_PI);

            switch (this.attackPattern) {
                case 'single':
                    // 单发精准射击
                    var asteroid = new Asteroid(
                        this.x, this.y,
                        randUniform(20, 10),
                        angleToShip
                    );
                    asteroid.v = Point.polar(4, angleToShip);
                    asteroids.push(asteroid);
                    break;

                case 'triple':
                    // 三连发
                    for (var i = -1; i <= 1; i++) {
                        var angle = angleToShip + i * 0.2;
                        var asteroid = new Asteroid(
                            this.x, this.y,
                            randUniform(15, 8),
                            angle
                        );
                        asteroid.v = Point.polar(3.5, angle);
                        asteroids.push(asteroid);
                    }
                    break;

                case 'spread':
                    // 扇形散射
                    for (var i = 0; i < 5; i++) {
                        var angle = angleToShip + randUniform(0.5, -0.5);
                        var asteroid = new Asteroid(
                            this.x, this.y,
                            randUniform(12, 6),
                            angle
                        );
                        asteroid.v = Point.polar(3, angle);
                        asteroids.push(asteroid);
                    }
                    break;
            }
        };

        Wingman.prototype.update = function () {
            if (this.vanished) return;

            // 生成动画
            var spawnProgress = (new Date().getTime() - this.spawnTime) / 500; // 0.5秒生成动画
            if (spawnProgress < 1) {
                this.spawnRadius = this.maxSpawnRadius * Math.sin(spawnProgress * PI);
                return; // 生成动画期间不移动
            }

            // 正常移动逻辑
            if (octopus && !octopus.vanished) {
                this.destination.set(octopus.x, octopus.y);

                var v = this.v.set(this.destination).sub(this);
                var dist = v.length();

                if (dist > this.speed) {
                    v.normalize(this.speed);
                }

                this.add(v);
                this.path.eachPoints(function (p, i) { p.add(v); });
            }
            // 如果没有章鱼，僚机停止移动

            // 攻击逻辑
            this.attackTimer += 1000 / FPS;
            if (this.attackTimer >= this.attackInterval) {
                this.fire();
                this.attackTimer = 0;
            }
        };

        Wingman.prototype.draw = function (ctx) {
            ctx.save();

            // 绘制生成特效
            if (this.spawnRadius > 0) {
                ctx.beginPath();
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.arc(this.x, this.y, this.spawnRadius, 0, TWO_PI);
                ctx.stroke();

                // 中心闪光点
                ctx.beginPath();
                ctx.fillStyle = this.color;
                ctx.arc(this.x, this.y, this.size * (1 - this.spawnRadius / this.maxSpawnRadius), 0, TWO_PI);
                ctx.fill();
            }

            // 绘制僚机主体
            ctx.beginPath();
            ctx.strokeStyle = this.color;
            ctx.lineWidth = 2;
            this.path.draw(ctx);
            ctx.stroke();

            // 绘制血量指示器（外圈圆弧）
            if (!this.invincible) { // 无敌状态下不显示血量
                var hpPercent = this.hp / this.hpMax;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size + 8, -PI / 2, -PI / 2 + TWO_PI * hpPercent);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            // 绘制中心点(无敌时闪烁)
            if (!this.invincible || Math.floor(Date.now() / 100) % 2 === 0) {
                ctx.beginPath();
                ctx.fillStyle = this.color;
                ctx.arc(this.x, this.y, 3, 0, TWO_PI);
                ctx.fill();
            }

            // 攻击方向标识
            if (ship && !this.vanished && !this.invincible) {
                ctx.beginPath();
                ctx.strokeStyle = 'white'; // 短线颜色
                ctx.lineWidth = 1; // 短线宽度

                // 计算指向玩家的角度
                var angle = Math.atan2(ship.y - this.y, ship.x - this.x);

                // 从中心点向外绘制10像素的线
                var lineLength = 18;
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(
                    this.x + Math.cos(angle) * lineLength,
                    this.y + Math.sin(angle) * lineLength
                );
                ctx.stroke();
            }

            ctx.restore();
        };


        /**
         * FriendlyTurret
         * 
         * @super Point
         */
        function FriendlyTurret(x, y) {
            Point.call(this, x, y);
            this.spawnTime = new Date().getTime();
            this.size = TURRET_CONFIG.size;
            this.attackTimer = 0;

            // 创建炮台路径
            this.path = new Path();
            for (var i = 0; i < 8; i++) {
                var angle = TWO_PI * i / 8;
                this.path.push(new Point(
                    this.x + this.size * Math.cos(angle),
                    this.y + this.size * Math.sin(angle)
                ));
            }
        }

        FriendlyTurret.prototype = extend(new Point(), {
            vanished: false,

            update: function () {
                // 检查是否超时（只在章鱼存在时倒计时）
                if (!octopus || octopus.vanished) {
                    this.spawnTime += 1000 / FPS; // 章鱼存在时才增加时间
                }

                // 检查是否超时
                if (new Date().getTime() - this.spawnTime > TURRET_CONFIG.duration) {
                    this.vanished = true;
                    return;
                }

                // 攻击逻辑（只在章鱼存在时攻击）
                this.attackTimer += 1000 / FPS;
                if (this.attackTimer >= TURRET_CONFIG.attackInterval && octopus && !octopus.vanished) {
                    this.fire();
                    this.attackTimer = 0;
                }
            },

            fire: function () {
                if (!octopus || octopus.vanished) return;

                // 计算朝向章鱼的角度
                var angle = this.angleTo(octopus);

                // 创建子弹配置
                var bulletConfig = {
                    name: '炮台子弹',
                    power: TURRET_CONFIG.bulletPower,
                    speed: TURRET_CONFIG.bulletSpeed,
                    length: 10,
                    width: 2,
                    color: 'rgb(0, 200, 255)',
                    shootingInterval: TURRET_CONFIG.attackInterval,
                    through: false,
                    explosion: {
                        range: 140,
                        speed: 4
                    },
                };

                // 发射子弹
                var bullet = new Beam(this.x, this.y, angle, bulletConfig);
                beams.push(bullet);
            },

            draw: function (ctx) {
                ctx.save();

                // 绘制炮台主体
                ctx.beginPath();
                ctx.strokeStyle = 'rgb(0, 200, 255)';
                ctx.lineWidth = 2;
                this.path.draw(ctx);
                ctx.stroke();

                // 绘制炮管（指向章鱼）
                if (octopus && !octopus.vanished) {
                    var angle = this.angleTo(octopus);
                    var barrelLength = this.size;

                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(
                        this.x + Math.cos(angle) * barrelLength,
                        this.y + Math.sin(angle) * barrelLength
                    );
                    ctx.stroke();
                }

                // 绘制剩余时间指示器
                var progress = 1 - (new Date().getTime() - this.spawnTime) / TURRET_CONFIG.duration;
                if (progress > 0) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size + 5, -PI / 2, -PI / 2 + TWO_PI * progress);

                    // 章鱼不存在时显示为灰色暂停状态
                    if (!octopus || octopus.vanished) {
                        ctx.strokeStyle = 'rgba(150, 150, 150, 0.7)';
                    } else {
                        ctx.strokeStyle = 'rgba(0, 200, 255, 0.7)';
                    }

                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                // 章鱼不存在时显示暂停图标
                if (!octopus || octopus.vanished) {
                    ctx.fillStyle = 'rgba(150, 150, 150, 0.7)';
                    ctx.fillRect(this.x - 3, this.y - 6, 2, 12);
                    ctx.fillRect(this.x + 1, this.y - 6, 2, 12);
                }

                ctx.restore();
            }
        });


        /**
         * Item
         * 
         * @super Point
         */
        function Item(x, y) {
            Point.call(this, x, y);

            var path = this.path = new Path();

            var d = TWO_PI / 6;
            for (var i = 0; i < 6; i++) {
                path.push(Point.polar(10, d * i).add(this));
            }

            this.wepon = WEPON_SPECIAL[randInt(WEPON_SPECIAL.length - 1)];

            this.v = Point.polar(ITEM_SPEED, randUniform(TWO_PI));
        }

        Item.prototype = extend(new Point(), {
            update: function () {
                var v = this.v;
                this.add(v);
                this.path.eachPoints(function (p, i) { p.add(v); });

                // 画面外に出たら消失
                if (!fieldRange.contains(this.x, this.y, 20)) {
                    this.vanished = true;
                    return;
                }
            },

            draw: function (ctx) {
                ctx.save();
                ctx.strokeStyle = this.wepon.color;
                this.path.draw(ctx);
                // 対角線を描画
                this.path.eachPoints(function (p, i) {
                    if (i === 3) return false;
                    ctx.moveTo(p.x, p.y);
                    var p2 = this[i + 3];
                    ctx.lineTo(p2.x, p2.y);
                });
                ctx.restore();
            }
        });


        /**
         * Splinter
         * 
         * @super Point
         */
        function Splinter(x, y, radius, num) {
            Point.call(this, x, y);

            // 检查并限制总数
            while (splinters.length >= MAX_SPLINTERS && splinters.length > 0) {
                splinters.shift(); // 移除最旧的splinter
            }

            var values = this._values = [];
            for (var i = 0; i < num; i++) {
                values.push({
                    x: x, y: y,
                    angle: randUniform(TWO_PI),
                    radius: randUniform(radius),
                    dist: Math.random()
                });
            }

            this._time = new Date().getTime();
        }

        Splinter.prototype = extend(new Point(), {
            vanished: false,

            update: function () {
                var o, c, r, x, y;

                for (var i = 0, len = this._values.length; i < len; i++) {
                    o = this._values[i];
                    c = o.angle;
                    r = o.radius;
                    x = o.x = Math.round(this.x + r * Math.cos(c));
                    y = o.y = Math.round(this.y + r * Math.sin(c));

                    // 画面外に出たら消失
                    if (!fieldRange.contains(x, y)) {
                        this._values.splice(i, 1);
                        len--;
                        i--;
                        continue;
                    }

                    this._values[i].radius += o.dist;
                }

                // 破片が全て画面外に消失しているか, 発生から指定時間が経過しているなら消失
                this.vanished = this._values.length === 0 || new Date().getTime() - this._time > 1000 * 7;
            },

            draw: function (ctx) {
                for (var i = 0, len = this._values.length, o; i < len; i++) {
                    o = this._values[i];
                    ctx.rect(o.x, o.y, 1, 1);
                }
            }
        });


        /**
         * Debri
         * 
         * @super Point
         */
        function Debri(x) {
            Point.call(this, x, randInt(canvasHeight));
            this.speed = randUniform(2, 0.5);
        }

        Debri.prototype = extend(new Point(), {
            vanished: false,

            update: function () {
                if (this.vanished) return;

                // 画面外に出たら消失
                if (this.x < 0) {
                    this.vanished = true;
                    return;
                }

                this.x = Math.round(this.x - this.speed);
            },

            draw: function (ctx) {
                ctx.rect(this.x, this.y, 1, 1);
            }
        });


        // Init
        window.addEventListener('load', init, false);
    </script>
